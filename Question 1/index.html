<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Registration | Client-Side Form Validation</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

  <main class="page-wrapper">
    <div class="registration-container">
      
      <!-- Panel Header -->
      <header class="card-header">
        <div class="brand-badge">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
            <circle cx="8.5" cy="7" r="4"></circle>
            <line x1="20" y1="8" x2="20" y2="14"></line>
            <line x1="23" y1="11" x2="17" y2="11"></line>
          </svg>
        </div>
        <h1 class="header-title">Create an Account</h1>
        <p class="header-desc">Please complete all required fields below to create your account.</p>
      </header>

      <!-- Dynamic Success Notification Panel -->
      <section id="successBox" class="success-panel" style="display: none;" aria-live="polite">
        <div class="success-icon-wrapper">
          <svg class="check-svg" viewBox="0 0 24 24" width="34" height="34" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"></polyline>
          </svg>
        </div>
        <h2 class="success-title">Registration Successful!</h2>
        <p id="welcomeGreeting" class="success-msg"></p>
        <p class="success-subtext">All client-side validations have passed successfully.</p>
        <button type="button" id="btnNewRegistration" class="btn-new-reg">Register Another User</button>
      </section>

      <!-- Registration Form -->
      <form id="regForm" class="signup-form" novalidate>
        
        <div class="form-columns">

          <!-- Full Name -->
          <div class="form-field">
            <label for="fullName">Full Name <span class="mark-required">*</span></label>
            <div class="field-box">
              <span class="field-icon">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
              </span>
              <input type="text" id="fullName" name="fullName" placeholder="Enter your full name" autocomplete="name">
            </div>
            <small id="fullNameError" class="field-error"></small>
          </div>

          <!-- Email Address -->
          <div class="form-field">
            <label for="email">Email Address <span class="mark-required">*</span></label>
            <div class="field-box">
              <span class="field-icon">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="2"></rect><path d="m22 7-10 7L2 7"></path></svg>
              </span>
              <input type="email" id="email" name="email" placeholder="name@domain.com" autocomplete="email">
            </div>
            <small id="emailError" class="field-error"></small>
          </div>

          <!-- Mobile Number -->
          <div class="form-field">
            <label for="mobile">Mobile Number <span class="mark-required">*</span></label>
            <div class="field-box">
              <span class="field-icon">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="2" width="14" height="20" rx="2" ry="2"></rect><line x1="12" y1="18" x2="12.01" y2="18"></line></svg>
              </span>
              <input type="tel" id="mobile" name="mobile" placeholder="10-digit mobile number" maxlength="10" autocomplete="tel">
            </div>
            <small id="mobileError" class="field-error"></small>
          </div>

          <!-- Gender Radio Selection -->
          <div class="form-field">
            <label class="group-title">Gender <span class="mark-required">*</span></label>
            <div class="gender-options" id="genderGroup">
              <label class="radio-pill">
                <input type="radio" name="gender" id="genderMale" value="Male">
                <span>Male</span>
              </label>
              <label class="radio-pill">
                <input type="radio" name="gender" id="genderFemale" value="Female">
                <span>Female</span>
              </label>
              <label class="radio-pill">
                <input type="radio" name="gender" id="genderOther" value="Other">
                <span>Other</span>
              </label>
            </div>
            <small id="genderError" class="field-error"></small>
          </div>

          <!-- Password -->
          <div class="form-field">
            <label for="password">Password <span class="mark-required">*</span></label>
            <div class="field-box">
              <span class="field-icon">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
              </span>
              <input type="password" id="password" name="password" placeholder="Create a strong password" autocomplete="new-password">
            </div>
            <small id="passwordError" class="field-error"></small>
          </div>

          <!-- Confirm Password -->
          <div class="form-field">
            <label for="confirmPassword">Confirm Password <span class="mark-required">*</span></label>
            <div class="field-box">
              <span class="field-icon">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>
              </span>
              <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Confirm your password" autocomplete="new-password">
            </div>
            <small id="confirmPasswordError" class="field-error"></small>
          </div>

          <!-- Date of Birth -->
          <div class="form-field">
            <label for="dob">Date of Birth <span class="mark-required">*</span></label>
            <div class="field-box">
              <span class="field-icon">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
              </span>
              <input type="date" id="dob" name="dob">
            </div>
            <small id="dobError" class="field-error"></small>
          </div>

          <!-- City Selection Dropdown -->
          <div class="form-field">
            <label for="city">City <span class="mark-required">*</span></label>
            <div class="field-box select-field-box">
              <span class="field-icon">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>
              </span>
              <select id="city" name="city">
                <option value="">-- Select Your City --</option>
                <option value="Bengaluru">Bengaluru</option>
                <option value="Chennai">Chennai</option>
                <option value="Coimbatore">Coimbatore</option>
                <option value="Delhi">Delhi</option>
                <option value="Hyderabad">Hyderabad</option>
                <option value="Kochi">Kochi</option>
                <option value="Kolkata">Kolkata</option>
                <option value="Mumbai">Mumbai</option>
                <option value="Pune">Pune</option>
                <option value="Ahmedabad">Ahmedabad</option>
              </select>
              <span class="custom-arrow">
                <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"></polyline></svg>
              </span>
            </div>
            <small id="cityError" class="field-error"></small>
          </div>

        </div>

        <!-- Terms and Conditions Checkbox -->
        <div class="agreement-area" id="termsBox">
          <label class="custom-checkbox-label">
            <input type="checkbox" id="terms" name="terms">
            <span class="checkbox-caption">I accept and agree to the <a href="#termsModal" class="legal-link">Terms &amp; Conditions</a> <span class="mark-required">*</span></span>
          </label>
          <small id="termsError" class="field-error"></small>
        </div>

        <!-- Action Buttons -->
        <div class="actions-row">
          <button type="submit" id="btnRegister" class="action-btn btn-primary">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="8.5" cy="7" r="4"></circle><polyline points="17 11 19 13 23 9"></polyline></svg>
            <span>Register</span>
          </button>
          <button type="reset" id="btnReset" class="action-btn btn-secondary">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path><polyline points="3 3 3 8 8 8"></polyline></svg>
            <span>Reset</span>
          </button>
        </div>

      </form>
    </div>
  </main>

  <script src="validation.js"></script>
</body>
</html>
